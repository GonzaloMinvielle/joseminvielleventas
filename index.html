<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreta de ventas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E5B3F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3A9B6B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreta">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF2EE;--surface:#FFFFFF;--field:#F6F8F6;--ink:#17231D;--muted:#5A6A61;--line:#D3DCD6;
  --green:#1E5B3F;--green-2:#2A7550;--amber:#F2B200;--warn:#B4460F;--board:#163F2C;--board-ink:#FFFFFF;
  --radius:10px;--disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tap:44px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613;--surface:#17211C;--field:#1D2A23;--ink:#E4EBE7;--muted:#98A89F;--line:#2A3831;
  --green:#3A9B6B;--green-2:#52B282;--amber:#F5C542;--warn:#F0894A;--board:#0B2217;--board-ink:#F1F5F2;}}
:root[data-theme="dark"]{--bg:#0F1613;--surface:#17211C;--field:#1D2A23;--ink:#E4EBE7;--muted:#98A89F;--line:#2A3831;
  --green:#3A9B6B;--green-2:#52B282;--amber:#F5C542;--warn:#F0894A;--board:#0B2217;--board-ink:#F1F5F2;}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
h1{font-size:1.7rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* El header pinta también la zona de la barra de estado (app instalada en iPhone) */
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:.75rem;
  padding:.7rem max(1rem,env(safe-area-inset-right,0px)) .7rem max(1rem,env(safe-area-inset-left,0px))}
.brand{min-width:0}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:.55rem}
.brand svg{flex:none}
.brand h1{font-size:1.5rem}
nav.tabs{display:flex;gap:.25rem;margin-left:auto}
nav.tabs button{background:none;border:0;color:#fff;opacity:.78;padding:.5rem .8rem;border-radius:8px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:.4rem}
nav.tabs button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.16)}
nav.tabs svg{width:20px;height:20px}
main{max-width:1100px;margin:0 auto;padding:1rem max(1rem,env(safe-area-inset-right,0px)) 6rem max(1rem,env(safe-area-inset-left,0px))}
@media (max-width:820px){
  nav.tabs button span{white-space:nowrap}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);
    padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}
  nav.tabs button{color:var(--muted);opacity:1;flex-direction:column;gap:.1rem;font-size:.72rem;padding:.35rem .2rem;flex:1}
  nav.tabs button[aria-current="page"]{color:var(--green);background:none}
  main{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))}
  .bar .search{order:3;flex-basis:100%}
}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:.4rem 0 1rem}
.bar h2{margin-right:auto}
.search{flex:1 1 240px;min-width:0;padding:.65rem .8rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:.8rem;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;opacity:.7;margin-left:.25rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);
  padding:.6rem 1rem;border-radius:var(--radius);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--warn)}
.btn.sm{padding:.4rem .7rem;font-size:.9rem}
.btn svg{width:18px;height:18px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;text-decoration:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn.wa{color:#fff;background:#1FA855;border-color:#1FA855}

.list{display:grid;gap:.5rem;grid-template-columns:minmax(0,1fr)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.75rem .9rem;display:flex;align-items:center;gap:.8rem;cursor:pointer;text-align:left;width:100%;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* En el celu el nombre puede ocupar dos renglones: así las etiquetas (Debe, Vendido) no quedan cortadas */
@media (max-width:820px){.row .t{white-space:normal;overflow-wrap:anywhere}}
.row .amt{text-align:right;font-family:var(--disp);font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt small{display:block;font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:.08rem .45rem;border-radius:5px;border:1px solid currentColor;margin-left:.35rem;vertical-align:1px}
.tag.pres{color:var(--muted)}.tag.vend{color:var(--green-2)}.tag.debe{color:var(--warn)}.tag.hist{color:var(--muted);border-style:dashed}
.flag{color:var(--warn);font-size:.8rem;font-weight:600}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

/* Tablero: el marcador del pedido y del resumen */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--radius);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));overflow:hidden}
.board > div{padding:.8rem 1rem;border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);min-width:0}
.board > div:last-child{border-right:0}
.board .k{font-size:.85rem;opacity:.75}
.board .v{font-family:var(--disp);font-weight:700;font-size:clamp(1.3rem,5vw,2rem);overflow-wrap:anywhere;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* El número se achica según el ancho de su casillero, así un monto largo no se parte en dos renglones */
@supports (container-type:inline-size){
  .board > div{container-type:inline-size}
  .board .v{font-size:clamp(1.1rem,16cqi,2rem)}
}
.board .v.gold{color:var(--amber)}
.board .v.warn{color:#FFB38A}

.grid2{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.card h3{margin-bottom:.7rem}
.barchart{display:grid;gap:.45rem}
.bc{display:grid;grid-template-columns:7.5rem 1fr 3.2rem;align-items:center;gap:.5rem;font-size:.92rem}
.bc .track{height:12px;background:var(--field);border-radius:6px;overflow:hidden}
.bc .fill{height:100%;background:var(--green-2);border-radius:6px}
.bc .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* Productos: en el celu cada producto es una tarjeta; desde 641 px, tabla */
.ptable{display:block;width:100%;border-collapse:collapse}
.ptable thead{display:none}
.ptable tbody{display:grid;gap:.5rem}
.ptable tr{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"f n n x" "c c p p" "g g m v";
  gap:.5rem .6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.6rem}
.ptable td{display:block;min-width:0;padding:0}
.ptable td[data-label]::before{content:attr(data-label);display:block;font-size:.78rem;color:var(--muted);font-weight:500;margin-bottom:.15rem}
.ptable .c-f{grid-area:f}.ptable .c-n{grid-area:n}.ptable .c-x{grid-area:x}.ptable .c-c{grid-area:c}.ptable .c-p{grid-area:p}
.ptable .g{grid-area:g}.ptable .m{grid-area:m}.ptable .c-v{grid-area:v}
.ptable td.num{font-variant-numeric:tabular-nums;font-weight:600;align-self:start}
.ptable td input{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);padding:.55rem .6rem;border-radius:8px;font-size:1rem}
.ptable .c-n input{font-weight:600}
.nop{color:var(--warn);font-size:.8rem;font-weight:600}
@media (min-width:641px){
  .tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .ptable{display:table;min-width:640px}
  .ptable thead{display:table-header-group}
  .ptable tbody{display:table-row-group}
  .ptable tr{display:table-row;background:none;border:0;border-radius:0;padding:0}
  .ptable td{display:table-cell;padding:.45rem .6rem}
  .ptable th,.ptable td{border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  .ptable td[data-label]::before{content:none}
  .ptable th{font-size:.85rem;color:var(--muted);font-weight:600;background:var(--field);padding:.45rem .6rem}
  .ptable td.num,.ptable th.num{text-align:right;font-weight:400}
  .ptable tr:last-child td{border-bottom:0}
  .ptable td input{border-color:transparent;background:transparent;padding:.35rem .4rem;border-radius:6px}
  .ptable td input:hover,.ptable td input:focus{border-color:var(--line);background:var(--field)}
  .ptable td input.num{text-align:right}
  .ptable .c-n input{font-weight:400}
}

/* Formularios */
label.f{display:grid;gap:.25rem;font-size:.88rem;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:.6rem .7rem;color:var(--ink);font-size:1rem;width:100%;min-width:0}
textarea{resize:vertical;min-height:4rem}
.fgrid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.55rem .9rem;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(5,15,10,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.sheet{background:var(--bg);width:min(760px,100%);max-height:calc(100% - 2rem);overflow:auto;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h2{flex:1}
.sheet-b{padding:1rem;display:grid;gap:1rem}
.sheet-f{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:.5rem}
.sheet-f .sp{flex:1}
@media (max-width:640px){
  .overlay{padding:0;align-items:stretch}
  .sheet{max-height:none;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .sheet-h{top:0}
}
.items{display:grid;gap:.5rem}
.item{display:grid;grid-template-columns:1fr 4.5rem 7.5rem 7rem 2.4rem;gap:.4rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.45rem}
.item .sub{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.item .inp{padding:.5rem .5rem}
.ihead{display:grid;grid-template-columns:1fr 4.5rem 7.5rem 7rem 2.4rem;gap:.4rem;font-size:.8rem;color:var(--muted);padding:0 .5rem}
@media (max-width:640px){
  .ihead{display:none}
  .item{grid-template-columns:4.5rem minmax(0,1fr) auto;grid-template-areas:"p p x" "q pr s"}
  .item .sub{padding-right:.3rem}.item .c-x{justify-self:end}
  .sheet-f .sp{display:none}.sheet-f .btn{flex:1 1 auto}
  .item .c-p{grid-area:p}.item .c-q{grid-area:q}.item .c-x{grid-area:x}.item .c-pr{grid-area:pr}.item .sub{grid-area:s;align-self:center}
}
.hint{font-size:.85rem;color:var(--muted)}
.note{background:var(--field);border-left:4px solid var(--amber);padding:.6rem .8rem;border-radius:6px;font-size:.92rem}
.thumb{width:44px;height:44px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--muted);background:var(--field);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb svg{width:22px;height:22px}
.thumb.sm{width:34px;height:34px;cursor:inherit}.thumb.sm svg{width:18px;height:18px}
.crow{display:grid;gap:.5rem;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;opacity:.62}
.crow.on{opacity:1;border-color:var(--green-2)}
.crow.cols-1{grid-template-columns:minmax(0,1fr) 8rem}.crow.cols-2{grid-template-columns:minmax(0,1fr) repeat(2,7.5rem)}.crow.cols-3{grid-template-columns:minmax(0,1fr) repeat(3,7rem)}
.cname{display:flex;align-items:center;gap:.55rem;font-weight:600;cursor:pointer;align-self:center;min-width:0}
.cname input{width:20px;height:20px;accent-color:var(--green);flex:none}
.f.mini{font-size:.78rem}.f.mini .inp{padding:.45rem .5rem}
@media (max-width:640px){.crow.cols-1{grid-template-columns:minmax(0,1fr)}.crow.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.crow.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.crow .cname{grid-column:1/-1}}
.tag[hidden]{display:none}
#sync{font-size:.82rem;opacity:.85;margin-left:auto;white-space:nowrap}
#sync[data-st="error"],#sync[data-st="offline"]{opacity:1;color:#FFD27A;white-space:normal;max-width:20rem}
nav.tabs{margin-left:0}
@media (min-width:821px){#sync{margin-left:auto;order:2}nav.tabs{order:3}}
.gate{max-width:26rem;margin:3rem auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.5rem}
.gate h2{margin-bottom:.5rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:8px;z-index:90;max-width:90vw;font-weight:500}
.actions{display:flex;gap:.4rem;flex:none}
.sheet-b > .seg{justify-self:start}
.install{display:grid;gap:.6rem;align-content:start}.install[hidden]{display:none}
.install h3{margin-bottom:0}.install p{margin:0}

/* Pantallas táctiles: todo lo que se toca mide al menos 44 px y los campos usan 16 px (así iOS no hace zoom) */
@media (pointer:coarse){
  .btn,.btn.sm,.chip,.seg button{min-height:var(--tap)}
  .icon-btn{width:var(--tap);height:var(--tap)}
  .search,label.f input,label.f select,.inp,.ptable td input{min-height:var(--tap);font-size:16px}
  .chips{padding-bottom:.1rem}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#fff"/><path d="M16 9.5l5.2 3.8-2 6.1h-6.4l-2-6.1z" fill="#17231D"/><path d="M16 2v7.5M21.2 13.3l7-2.3M19.2 19.4l4.3 6M12.8 19.4l-4.3 6M10.8 13.3l-7-2.3" stroke="#17231D" stroke-width="1.6"/></svg>
    <h1>Libreta de ventas</h1>
  </div>
  <span id="sync" aria-live="polite"></span>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="main"></main>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
